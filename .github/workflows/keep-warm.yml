name: Keep Resolver Warm

on:
  schedule:
    - cron: '*/7 * * * *'   # every 5 minutes
  workflow_dispatch:        # allows manual run

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render resolver
        run: |
          echo "Pinging resolver to prevent cold start..."
          curl -s -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            "https://fctv33-stream-resolver.onrender.com/" || true
